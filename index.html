<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlateCraft — See your plate before you buy it</title>
<meta name="description" content="Design road-legal UK number plates and see them live in Printed, 3D Gel, 4D and 5D finishes, on your own car, before you buy.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0B0F">
<link rel="preload" as="image" href="/assets/poster.jpg" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Manrope:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Anton&family=Kaushan+Script&display=swap">
<link rel="modulepreload" href="/vendor/preact-htm.js">
<link rel="modulepreload" href="/plate.js">
<style>

body{margin:0;background:#0A0B0F}
a{color:#7CC4FF}a:hover{color:#B5DDFF}
.stage-zoom{zoom:1}
.plate-zoom{zoom:1}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.rise-2{animation-delay:.35s}
.plate-float{animation:floaty 6s ease-in-out infinite}
#top{background-image:url(/assets/poster.jpg) !important;background-size:cover !important;background-position:60% 50% !important}
@media (max-width:1100px){.hero-h1{font-size:80px !important}}
@media (max-width:760px){.plate-zoom{zoom:.68}.stage-zoom{zoom:.6}.hero-h1{font-size:54px !important}.sec-h2{font-size:36px !important}.bar-top,.bar-bot{height:20px !important}}
@media (prefers-reduced-motion:reduce){.hero-video{display:none}.rise,.plate-float{animation:none}}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #7CC4FF;outline-offset:3px}
.car-img{position:absolute;inset:0;width:100%;height:100%;display:block}
.tint{position:absolute;inset:0;mix-blend-mode:multiply;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transition:background-color .5s ease}
.tint-hatch{-webkit-mask-image:url(/assets/hatch-mask.png);mask-image:url(/assets/hatch-mask.png)}
.tint-saloon{-webkit-mask-image:url(/assets/saloon-mask.png);mask-image:url(/assets/saloon-mask.png)}
.tint-suv{-webkit-mask-image:url(/assets/suv-mask.png);mask-image:url(/assets/suv-mask.png)}
.tint-coupe{-webkit-mask-image:url(/assets/coupe-mask.png);mask-image:url(/assets/coupe-mask.png)}
.car-hl{position:absolute;inset:0;width:100%;height:100%;display:block;mix-blend-mode:screen;opacity:.85;pointer-events:none}
.car-plate{position:absolute;transform:translate(-50%,-50%);z-index:2}
.swatch{width:44px;height:44px;border-radius:50%;cursor:pointer;padding:0}
.to-top{position:fixed;right:20px;bottom:20px;z-index:60;width:54px;height:54px;border-radius:50%;background:#7CC4FF;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s ease,transform .3s ease}
.field{height:48px;box-sizing:border-box;border-radius:10px;border:1px solid #3A3F4B;background:#0A0B0F;color:#EDEFF3;font-family:Manrope,sans-serif;font-size:15px;font-weight:600;padding:0 12px;width:100%;min-width:0}


body{margin:0}
.glyph{display:block;line-height:1;white-space:nowrap;text-box:trim-both cap alphabetic}

</style>
</head>
<body>
<div id="app"><div style="min-height:100vh;background:#030405 url(/assets/poster.jpg) 60% 50%/cover"></div></div>
<script type="module" src="/app.js"></script>
</body>
</html>
